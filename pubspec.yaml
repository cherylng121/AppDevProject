name: codingbahasa_app
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: 3.10.3

dependencies:
  flutter:
    sdk: flutter
  fl_chart: ^1.1.1
  shared_preferences: ^2.2.2
  connectivity_plus: ^7.0.0

  # State management
  provider: ^6.1.2
  bloc: ^9.1.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5

  # Firebase packages
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: 6.1.1
  firebase_ai: ^3.5.0
  google_generative_ai: ^0.4.0
  
  # File handling
  file_picker: ^10.3.8
  open_file: ^3.3.2
  image_picker: ^1.0.1
  firebase_storage: ^13.0.5
  path_provider: ^2.0.15
  permission_handler: ^12.0.1
  device_info_plus: ^12.3.0

  # PDF Viewer
  syncfusion_flutter_pdfviewer: ^32.1.19

  # YouTube player
  youtube_player_flutter: ^9.1.3

  # WebView support
  webview_flutter: ^4.8.0
  flutter_inappwebview: ^6.1.5

  # URL launcher
  url_launcher: ^6.3.0

  # Internationalization
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/CodingBahasa.png
    - assets/CBlogo.png
    - assets/1.png
    - assets/2.png